name: Terminal Cluster (test)

on:
  workflow_dispatch:

env:
  # Уникальные имена нод на каждый запуск: исключают конфликт со "старыми" нодами в tailnet
  NODE_PREFIX: node-${{ github.run_id }}

jobs:
  # --- ТЕРМИНАЛЬНЫЕ НОДЫ WINDOWS (3 штуки через matrix) ---
  win-node:
    runs-on: windows-2025
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        node: [1, 2, 3]
    steps:
      - name: Setup node ${{ matrix.node }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # --- Установка ПО: Tailscale + Notepad++ ---
          choco install tailscale notepadplusplus -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) { throw "Tailscale не установился" }

          $app = "C:\Program Files\Notepad++\notepad++.exe"
          if (-not (Test-Path $app)) {
            Write-Warning "Notepad++ не найден, используем notepad.exe"
            $app = "C:\Windows\System32\notepad.exe"
          }
          Write-Host "Shell program: $app"

          # --- RDP + NLA (до подключения к tailnet, чтобы порт уже слушал) ---
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Set-Service TermService -StartupType Automatic
          Start-Service TermService
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -DisplayName "RDP-3389-Any" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any | Out-Null

          # --- Политика паролей (пароль "test") ---
          secedit /export /cfg cfg.txt
          (Get-Content cfg.txt) `
            -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' `
            -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' |
            Set-Content cfg.txt -Encoding Unicode
          secedit /configure /db cfg.sdb /cfg cfg.txt /areas SECURITYPOLICY

          # --- Пользователь ---
          $Password = ConvertTo-SecureString "test" -AsPlainText -Force
          New-LocalUser "test" -Password $Password -PasswordNeverExpires
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "test"

          # --- Вместо рабочего стола: запуск программы при подключении ---
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $pol -Force | Out-Null
          Set-ItemProperty -Path $pol -Name InitialProgram -Value "`"$app`""
          Set-ItemProperty -Path $pol -Name WorkDirectory  -Value (Split-Path $app)

          $ws = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $ws -Name fInheritInitialProgram -Value 0
          Set-ItemProperty -Path $ws -Name InitialProgram -Value "`"$app`""
          Set-ItemProperty -Path $ws -Name WorkDirectory -Value (Split-Path $app)

          # --- Tailscale ---
          $name = "$env:NODE_PREFIX-${{ matrix.node }}"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=$name --unattended --accept-dns=false
          if ($LASTEXITCODE -ne 0) { throw "tailscale up завершился с кодом $LASTEXITCODE" }

          # --- Самопроверка ---
          Start-Sleep -Seconds 5
          Write-Host "=== tailscale status ==="
          & $ts status
          $myip = (& $ts ip -4 | Select-Object -First 1)
          Write-Host "Tailscale IP: $myip   Hostname: $name"
          if (-not $myip) { throw "Нет Tailscale IP" }

          $listen = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
          if (-not $listen) { throw "RDP не слушает порт 3389" }
          Write-Host "RDP слушает 3389: OK"
          Write-Host "Node ${{ matrix.node }} ready"

      - name: Keep node alive
        shell: powershell
        run: Start-Sleep -Seconds 21000

  # --- БАЛАНСИРОВЩИК: Tailscale на хосте + HAProxy в host-network + публичный туннель ---
  load-balancer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Tailscale (нативный TUN)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: balancer-${{ github.run_id }}

      - name: Wait for Windows nodes
        run: |
          get_ip() {
            tailscale status --json | jq -r --arg h "$1" \
              '[.Peer[]? | select((.HostName|ascii_downcase)==($h|ascii_downcase) and .Online==true)][0].TailscaleIPs[0] // empty'
          }

          for i in 1 2 3; do
            name="${NODE_PREFIX}-$i"
            echo "Ждём $name ..."
            for t in $(seq 1 60); do
              ip=$(get_ip "$name")
              if [ -z "$ip" ]; then
                state="нет в tailnet / offline"
              elif timeout 3 bash -c "</dev/tcp/$ip/3389" 2>/dev/null; then
                echo "$name = $ip : 3389 OK"
                echo "NODE${i}_IP=$ip" >> "$GITHUB_ENV"
                break
              else
                state="в tailnet ($ip), но порт 3389 закрыт"
              fi

              echo "[$t/60] $name: $state"
              if [ $((t % 6)) -eq 0 ]; then tailscale status; fi
              if [ "$t" = "60" ]; then
                echo "::error::$name не готов за 10 минут"
                tailscale status
                exit 1
              fi
              sleep 10
            done
          done

      - name: HAProxy
        run: |
          mkdir -p "$HOME/haproxy"
          cat <<EOF > "$HOME/haproxy/haproxy.cfg"
          global
              log stdout format raw local0
          defaults
              log     global
              mode    tcp
              timeout connect 5s
              timeout client  1h
              timeout server  1h
          listen stats
              mode http
              bind 0.0.0.0:8404
              timeout client 50s
              timeout server 50s
              stats enable
              stats uri /
              stats refresh 2s
              stats auth admin:adminpass
          frontend rdp_front
              bind 0.0.0.0:3389
              default_backend rdp_back
          backend rdp_back
              balance roundrobin
              server win1 ${NODE1_IP}:3389 check inter 2s
              server win2 ${NODE2_IP}:3389 check inter 2s
              server win3 ${NODE3_IP}:3389 check inter 2s
          EOF

          docker run --rm --entrypoint haproxy -v "$HOME/haproxy:/cfg:ro" haproxy:lts -c -f /cfg/haproxy.cfg
          docker run -d --name haproxy --network host \
            -v "$HOME/haproxy:/usr/local/etc/haproxy:ro" haproxy:lts
          sleep 3
          docker logs haproxy
          curl -sf -u admin:adminpass http://127.0.0.1:8404/ >/dev/null && echo "HAProxy stats OK"

      - name: Public tunnel (bore.pub, fallback pinggy)
        run: |
          start_bore() {  # $1 = имя контейнера, $2 = локальный порт
            docker rm -f "$1" >/dev/null 2>&1 || true
            docker run -d --name "$1" --network host ekzhang/bore local "$2" --to bore.pub >/dev/null
            for i in $(seq 1 20); do
              p=$(docker logs "$1" 2>&1 | grep -oE 'bore\.pub:[0-9]+' | head -1 || true)
              if [ -n "$p" ]; then echo "$p"; return 0; fi
              sleep 1
            done
            docker logs "$1" >&2
            return 1
          }

          RDP_ADDR=$(start_bore bore-rdp 3389) || RDP_ADDR=""
          STATS_ADDR=$(start_bore bore-stats 8404) || STATS_ADDR=""

          if [ -z "$RDP_ADDR" ]; then
            echo "bore недоступен, пробуем pinggy (сессия до 60 мин)"
            nohup ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
              -o ExitOnForwardFailure=yes -R0:localhost:3389 tcp@a.pinggy.io \
              < /dev/null > "$HOME/pinggy.log" 2>&1 &
            for i in $(seq 1 30); do
              RDP_ADDR=$(grep -oE '[a-z0-9.-]+\.pinggy\.link:[0-9]+' "$HOME/pinggy.log" | head -1 || true)
              if [ -n "$RDP_ADDR" ]; then break; fi
              sleep 1
            done
            cat "$HOME/pinggy.log" || true
          fi

          if [ -z "$RDP_ADDR" ]; then
            echo "::error::Ни bore, ни pinggy не дали публичный адрес, см. логи выше"
            exit 1
          fi

          echo "=========================================================="
          echo "aRDP:   Host ${RDP_ADDR%%:*}   Port ${RDP_ADDR##*:}"
          echo "        user: test   password: test   домен: ПУСТО"
          if [ -n "$STATS_ADDR" ]; then
            echo "Stats:  http://$STATS_ADDR  (admin / adminpass)"
          fi
          echo "=========================================================="

      - name: Keep alive
        run: sleep 21000
