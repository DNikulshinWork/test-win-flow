name: 1C Terminal Cluster

on:
  workflow_dispatch:

jobs:
  # --- ТЕРМИНАЛЬНЫЕ НОДЫ WINDOWS SERVER ---
  win-node-1:
    runs-on: windows-2025
    steps:
      - name: Setup Node 1
        shell: powershell
        run: |
          choco install tailscale 1c-enterprise-thin-client -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=win-node-1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          secedit /export /cfg cfg.txt
          (Get-Content cfg.txt) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinPasswordLength = .*', 'MinPasswordLength = 4' | Set-Content cfg.txt
          secedit /configure /db cfg.sdb /cfg cfg.txt /areas SECURITYPOLICY
          $Password = ConvertTo-SecureString "test" -AsPlainText -Force
          New-LocalUser "test" -Password $Password
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "test"
          $1cPath = "C:\Program Files\1cv8\common\1cv8c.exe"
          $userSID = (New-Object System.Security.Principal.NTAccount("test")).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $targetKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\UserApps\$userSID"
          New-Item -Path $targetKey -Force
          Set-ItemProperty -Path $targetKey -Name "Shell" -Value $1cPath
      - name: Keep Node Alive
        shell: powershell
        run: Start-Sleep -Seconds 21600

  win-node-2:
    runs-on: windows-2025
    steps:
      - name: Setup Node 2
        shell: powershell
        run: |
          choco install tailscale 1c-enterprise-thin-client -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=win-node-2
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          secedit /export /cfg cfg.txt
          (Get-Content cfg.txt) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinPasswordLength = .*', 'MinPasswordLength = 4' | Set-Content cfg.txt
          secedit /configure /db cfg.sdb /cfg cfg.txt /areas SECURITYPOLICY
          $Password = ConvertTo-SecureString "test" -AsPlainText -Force
          New-LocalUser "test" -Password $Password
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "test"
          $1cPath = "C:\Program Files\1cv8\common\1cv8c.exe"
          $userSID = (New-Object System.Security.Principal.NTAccount("test")).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $targetKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\UserApps\$userSID"
          New-Item -Path $targetKey -Force
          Set-ItemProperty -Path $targetKey -Name "Shell" -Value $1cPath
      - name: Keep Node Alive
        shell: powershell
        run: Start-Sleep -Seconds 21600

  win-node-3:
    runs-on: windows-2025
    steps:
      - name: Setup Node 3
        shell: powershell
        run: |
          choco install tailscale 1c-enterprise-thin-client -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=win-node-3
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          secedit /export /cfg cfg.txt
          (Get-Content cfg.txt) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinPasswordLength = .*', 'MinPasswordLength = 4' | Set-Content cfg.txt
          secedit /configure /db cfg.sdb /cfg cfg.txt /areas SECURITYPOLICY
          $Password = ConvertTo-SecureString "test" -AsPlainText -Force
          New-LocalUser "test" -Password $Password
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "test"
          $1cPath = "C:\Program Files\1cv8\common\1cv8c.exe"
          $userSID = (New-Object System.Security.Principal.NTAccount("test")).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $targetKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\UserApps\$userSID"
          New-Item -Path $targetKey -Force
          Set-ItemProperty -Path $targetKey -Name "Shell" -Value $1cPath
      - name: Keep Node Alive
        shell: powershell
        run: Start-Sleep -Seconds 21600

  # --- БАЛАНСИРОВЩИК НАГРУЗКИ HAProxy ---
  load-balancer:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Network & HAProxy
        run: |
          sudo apt-get update && sudo apt-get install -y curl jq haproxy
          sudo snap install tailscale
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=balancer
          
          cat <<EOF | sudo tee /etc/haproxy/haproxy.cfg
          global
                  log /dev/log local0
          defaults
                  log     global
                  mode    tcp
                  timeout connect 5s
                  timeout client  50s
                  timeout server  50s
          listen stats
                  mode http
                  bind *:8404
                  stats enable
                  stats uri /
                  stats refresh 2s
                  stats auth admin:adminpass
          frontend rdp_front
                  bind *:3389
                  default_backend rdp_back
          backend rdp_back
                  mode tcp
                  balance roundrobin
                  server win1 win-node-1:3389 check inter 2s
                  server win2 win-node-2:3389 check inter 2s
                  server win3 win-node-3:3389 check inter 2s
          EOF
          sudo systemctl restart haproxy

      - name: Start Localtonet Tunnels
        run: |
          # Скачиваем и распаковываем клиент туннелирования Localtonet
          curl -sSL https://localtonet.com -o l2n.zip
          sudo apt-get install -y unzip
          unzip l2n.zip
          chmod +x localtonet
          
          # Запускаем клиент в фоновом режиме с вашим токеном
          ./localtonet --token ${{ secrets.LOCALTONET_AUTH_TOKEN }} > /dev/null &
          sleep 5
          
          # Автоматически создаем TCP туннель для RDP (порт 3389) и HTTP для панели HAProxy (порт 8404) через их API
          curl -s -X POST "https://localtonet.com" -H "Content-Type: application/json" -d '{"Token":"'"${{ secrets.LOCALTONET_AUTH_TOKEN }}"'","Type":"tcp","LocalIp":"127.0.0.1","LocalPort":3389}' > rdp_res.txt
          curl -s -X POST "https://localtonet.com" -H "Content-Type: application/json" -d '{"Token":"'"${{ secrets.LOCALTONET_AUTH_TOKEN }}"'","Type":"http","LocalIp":"127.0.0.1","LocalPort":8404}' > stats_res.txt
          
          echo "=========================================================="
          echo "ДАННЫЕ ДЛЯ aRDP И БРАУЗЕРА:"
          echo "Зайдите в вашу панель управления https://localtonet.com"
          echo "Там во вкладке 'Tunnels' мгновенно отобразятся два адреса:"
          echo "1. TCP-адрес (для aRDP) вида: '://localtonet.com:XXXXX'"
          echo "2. HTTP-адрес (для панели статистики HAProxy)"
          echo "=========================================================="
          sleep 21600
