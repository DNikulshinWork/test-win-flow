name: Terminal Cluster (test)

on:
  workflow_dispatch:

env:
  # Уникальные имена нод на каждый запуск: исключают конфликт со "старыми" нодами в tailnet
  NODE_PREFIX: node-${{ github.run_id }}

jobs:
  # --- ТЕРМИНАЛЬНЫЕ НОДЫ WINDOWS (3 штуки через matrix) ---
  win-node:
    runs-on: windows-2025
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        node: [1, 2, 3]
    steps:
      - name: Setup node ${{ matrix.node }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # --- Установка ПО: Tailscale + Notepad++ ---
          choco install tailscale notepadplusplus -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")

          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) { throw "Tailscale не установился" }

          $app = "C:\Program Files\Notepad++\notepad++.exe"
          if (-not (Test-Path $app)) {
            Write-Warning "Notepad++ не найден, используем notepad.exe"
            $app = "C:\Windows\System32\notepad.exe"
          }
          Write-Host "Shell program: $app"

          # --- RDP + NLA (до подключения к tailnet, чтобы порт уже слушал) ---
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Set-Service TermService -StartupType Automatic
          Start-Service TermService
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          New-NetFirewallRule -DisplayName "RDP-3389-Any" -Direction Inbound -Protocol TCP -LocalPort 3389 -Action Allow -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName "Status-8080-Any" -Direction Inbound -Protocol TCP -LocalPort 8080 -Action Allow -Profile Any | Out-Null

          # --- Политика паролей (пароль "test") ---
          secedit /export /cfg cfg.txt
          (Get-Content cfg.txt) `
            -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' `
            -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' |
            Set-Content cfg.txt -Encoding Unicode
          secedit /configure /db cfg.sdb /cfg cfg.txt /areas SECURITYPOLICY

          # --- Пользователь ---
          $Password = ConvertTo-SecureString "test" -AsPlainText -Force
          New-LocalUser "test" -Password $Password -PasswordNeverExpires
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "test"

          # --- Вместо рабочего стола: запуск программы при подключении ---
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $pol -Force | Out-Null
          Set-ItemProperty -Path $pol -Name InitialProgram -Value "`"$app`""
          Set-ItemProperty -Path $pol -Name WorkDirectory  -Value (Split-Path $app)

          $ws = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $ws -Name fInheritInitialProgram -Value 0
          Set-ItemProperty -Path $ws -Name InitialProgram -Value "`"$app`""
          Set-ItemProperty -Path $ws -Name WorkDirectory -Value (Split-Path $app)

          # --- Tailscale ---
          $name = "$env:NODE_PREFIX-${{ matrix.node }}"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=$name --unattended --accept-dns=false
          if ($LASTEXITCODE -ne 0) { throw "tailscale up завершился с кодом $LASTEXITCODE" }

          # --- Самопроверка ---
          Start-Sleep -Seconds 5
          Write-Host "=== tailscale status ==="
          & $ts status
          $myip = (& $ts ip -4 | Select-Object -First 1)
          Write-Host "Tailscale IP: $myip   Hostname: $name"
          if (-not $myip) { throw "Нет Tailscale IP" }

          $listen = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
          if (-not $listen) { throw "RDP не слушает порт 3389" }
          Write-Host "RDP слушает 3389: OK"
          Write-Host "Node ${{ matrix.node }} ready"

      - name: Keep node alive + status endpoint (:8080)
        shell: powershell
        run: |
          # Отдаёт вывод quser (кто залогинен на этой ноде); заодно держит ноду живой
          $l = New-Object System.Net.HttpListener
          $l.Prefixes.Add("http://+:8080/")
          $l.Start()
          Write-Host "Status endpoint on :8080"
          $end = (Get-Date).AddSeconds(21000)
          while ((Get-Date) -lt $end) {
            $task = $l.GetContextAsync()
            while (-not $task.AsyncWaitHandle.WaitOne(1000)) {
              if ((Get-Date) -ge $end) { break }
            }
            if (-not $task.IsCompleted) { continue }
            try {
              $ctx = $task.Result
              $out = (quser 2>&1 | Out-String)
              $bytes = [Text.Encoding]::UTF8.GetBytes($out)
              $ctx.Response.ContentType = 'text/plain; charset=utf-8'
              $ctx.Response.OutputStream.Write($bytes, 0, $bytes.Length)
              $ctx.Response.Close()
            } catch { Write-Warning $_ }
          }

  # --- БАЛАНСИРОВЩИК: Tailscale на хосте + HAProxy в host-network + публичный туннель ---
  load-balancer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Tailscale (нативный TUN)
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: balancer-${{ github.run_id }}

      - name: Wait for Windows nodes
        run: |
          get_ip() {
            tailscale status --json | jq -r --arg h "$1" \
              '[.Peer[]? | select((.HostName|ascii_downcase)==($h|ascii_downcase) and .Online==true)][0].TailscaleIPs[0] // empty'
          }

          for i in 1 2 3; do
            name="${NODE_PREFIX}-$i"
            echo "Ждём $name ..."
            for t in $(seq 1 60); do
              ip=$(get_ip "$name")
              if [ -z "$ip" ]; then
                state="нет в tailnet / offline"
              elif timeout 3 bash -c "</dev/tcp/$ip/3389" 2>/dev/null; then
                echo "$name = $ip : 3389 OK"
                echo "NODE${i}_IP=$ip" >> "$GITHUB_ENV"
                break
              else
                state="в tailnet ($ip), но порт 3389 закрыт"
              fi

              echo "[$t/60] $name: $state"
              if [ $((t % 6)) -eq 0 ]; then tailscale status; fi
              if [ "$t" = "60" ]; then
                echo "::error::$name не готов за 10 минут"
                tailscale status
                exit 1
              fi
              sleep 10
            done
          done

      - name: HAProxy
        run: |
          mkdir -p "$HOME/haproxy"
          cat <<EOF > "$HOME/haproxy/haproxy.cfg"
          global
              log stdout format raw local0
          defaults
              log     global
              mode    tcp
              timeout connect 5s
              timeout client  1h
              timeout server  1h
          listen stats
              mode http
              bind 0.0.0.0:8404
              timeout client 50s
              timeout server 50s
              stats enable
              stats uri /
              stats refresh 2s
              stats auth admin:adminpass
          frontend rdp_front
              bind 0.0.0.0:3389
              default_backend rdp_back
          backend rdp_back
              balance roundrobin
              server win1 ${NODE1_IP}:3389 check inter 2s
              server win2 ${NODE2_IP}:3389 check inter 2s
              server win3 ${NODE3_IP}:3389 check inter 2s
          EOF

          docker run --rm --entrypoint haproxy -v "$HOME/haproxy:/cfg:ro" haproxy:lts -c -f /cfg/haproxy.cfg
          docker run -d --name haproxy --network host \
            -v "$HOME/haproxy:/usr/local/etc/haproxy:ro" haproxy:lts
          sleep 3
          docker logs haproxy
          curl -sf -u admin:adminpass http://127.0.0.1:8404/ >/dev/null && echo "HAProxy stats OK"

      - name: Dashboard (пользователи по нодам + HAProxy)
        run: |
          cat <<'PY' > "$HOME/dashboard.py"
          import base64, csv, io, json, os, re, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          NODES = [("win1", os.environ["NODE1_IP"]),
                   ("win2", os.environ["NODE2_IP"]),
                   ("win3", os.environ["NODE3_IP"])]
          AUTH = "Basic " + base64.b64encode(b"admin:adminpass").decode()

          def node_users(ip):
              try:
                  raw = urllib.request.urlopen("http://" + ip + ":8080/", timeout=4).read().decode("utf-8", "replace")
              except Exception as e:
                  return None, str(e)
              users = []
              for line in raw.splitlines():
                  s = line.strip().lstrip(">").strip()
                  if not s or s.upper().startswith(("USERNAME", "ПОЛЬЗОВАТЕЛЬ")):
                      continue
                  p = re.split(r"\s{2,}", s)
                  if len(p) >= 6:
                      users.append({"user": p[0], "session": p[1], "id": p[2], "state": p[3], "idle": p[4], "logon": p[5]})
                  elif len(p) == 5:
                      users.append({"user": p[0], "session": "-", "id": p[1], "state": p[2], "idle": p[3], "logon": p[4]})
              return users, None

          def haproxy():
              res = {}
              try:
                  req = urllib.request.Request("http://127.0.0.1:8404/;csv", headers={"Authorization": AUTH})
                  text = urllib.request.urlopen(req, timeout=4).read().decode()
                  for row in csv.DictReader(io.StringIO(text.lstrip("# "))):
                      if row.get("pxname") == "rdp_back" and row.get("svname", "").startswith("win"):
                          res[row["svname"]] = {"status": row.get("status"), "scur": row.get("scur"), "stot": row.get("stot")}
              except Exception as e:
                  res["error"] = str(e)
              return res

          def snapshot():
              with ThreadPoolExecutor(3) as ex:
                  results = list(ex.map(lambda n: node_users(n[1]), NODES))
              hp = haproxy()
              nodes = []
              for (name, ip), (users, err) in zip(NODES, results):
                  nodes.append({"name": name, "ip": ip, "users": users, "error": err, "haproxy": hp.get(name)})
              return {"nodes": nodes}

          PAGE = """<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
          <title>RDP cluster</title>
          <style>body{font:14px system-ui;margin:12px}table{border-collapse:collapse;width:100%;margin-bottom:14px}
          td,th{border:1px solid #bbb;padding:6px;text-align:left;vertical-align:top}th{background:#eee}
          .up{color:#0a0;font-weight:600}.down{color:#c00;font-weight:600}small{color:#666}</style>
          <h2>RDP-кластер</h2><div id=t>Загрузка…</div><small id=ts></small>
          <script>
          function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
          async function load(){
            var c=new AbortController(); var to=setTimeout(function(){c.abort()},10000);
            try{
              var r=await fetch("/api",{signal:c.signal}); var d=await r.json(); var total=0;
              var h="<table><tr><th>Нода</th><th>HAProxy</th><th>Сессий сейчас</th><th>Всего подключений</th><th>Пользователи на ноде</th></tr>";
              d.nodes.forEach(function(n){
                var hp=n.haproxy||{}; var cls=(hp.status||"").indexOf("UP")===0?"up":"down";
                var u;
                if(n.users===null){u="<span class=down>нет данных: "+esc(n.error)+"</span>";}
                else if(!n.users.length){u="—";}
                else{total+=n.users.length;u=n.users.map(function(x){return "<b>"+esc(x.user)+"</b> ("+esc(x.state)+", сессия "+esc(x.id)+", вход "+esc(x.logon)+")"}).join("<br>");}
                h+="<tr><td>"+esc(n.name)+"<br><small>"+esc(n.ip)+"</small></td><td class="+cls+">"+esc(hp.status||"?")+"</td><td>"+esc(hp.scur)+"</td><td>"+esc(hp.stot)+"</td><td>"+u+"</td></tr>";
              });
              h+="</table><b>Пользователей всего: "+total+"</b>";
              document.getElementById("t").innerHTML=h;
              document.getElementById("ts").textContent="обновлено "+new Date().toLocaleTimeString();
            }catch(e){document.getElementById("ts").textContent="ошибка загрузки, повтор... ("+e+")";}
            finally{clearTimeout(to);setTimeout(load,5000);}
          }
          load();
          </script>"""

          class H(BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_GET(self):
                  if self.headers.get("Authorization") != AUTH:
                      self.send_response(401)
                      self.send_header("WWW-Authenticate", 'Basic realm="cluster"')
                      self.end_headers()
                      return
                  if self.path.startswith("/api"):
                      body, ctype = json.dumps(snapshot()).encode(), "application/json"
                  else:
                      body, ctype = PAGE.encode(), "text/html; charset=utf-8"
                  self.send_response(200)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.end_headers()
                  self.wfile.write(body)

          ThreadingHTTPServer(("0.0.0.0", 8405), H).serve_forever()
          PY

          nohup python3 "$HOME/dashboard.py" > "$HOME/dashboard.log" 2>&1 &
          sleep 3
          curl -s -m 10 -u admin:adminpass http://127.0.0.1:8405/api | head -c 600 || true
          echo
          cat "$HOME/dashboard.log" || true

      - name: Public tunnel (bore.pub, fallback pinggy)
        run: |
          start_bore() {  # $1 = имя контейнера, $2 = локальный порт
            docker rm -f "$1" >/dev/null 2>&1 || true
            docker run -d --name "$1" --network host ekzhang/bore local "$2" --to bore.pub >/dev/null
            for i in $(seq 1 20); do
              p=$(docker logs "$1" 2>&1 | grep -oE 'bore\.pub:[0-9]+' | head -1 || true)
              if [ -n "$p" ]; then echo "$p"; return 0; fi
              sleep 1
            done
            docker logs "$1" >&2
            return 1
          }

          RDP_ADDR=$(start_bore bore-rdp 3389) || RDP_ADDR=""
          STATS_ADDR=$(start_bore bore-dash 8405) || STATS_ADDR=""

          if [ -z "$RDP_ADDR" ]; then
            echo "bore недоступен, пробуем pinggy (сессия до 60 мин)"
            nohup ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
              -o ExitOnForwardFailure=yes -R0:localhost:3389 tcp@a.pinggy.io \
              < /dev/null > "$HOME/pinggy.log" 2>&1 &
            for i in $(seq 1 30); do
              RDP_ADDR=$(grep -oE '[a-z0-9.-]+\.pinggy\.link:[0-9]+' "$HOME/pinggy.log" | head -1 || true)
              if [ -n "$RDP_ADDR" ]; then break; fi
              sleep 1
            done
            cat "$HOME/pinggy.log" || true
          fi

          if [ -z "$RDP_ADDR" ]; then
            echo "::error::Ни bore, ни pinggy не дали публичный адрес, см. логи выше"
            exit 1
          fi

          # IPv4-адрес туннеля: обходит клиентские прокси/сети без IPv6 (ошибка "Network is unreachable")
          RDP_HOST="${RDP_ADDR%%:*}"
          RDP_PORT_PUB="${RDP_ADDR##*:}"
          RDP_IPV4=$(getent ahostsv4 "$RDP_HOST" | awk '{print $1; exit}')
          [ -z "$RDP_IPV4" ] && RDP_IPV4="$RDP_HOST"

          # Самопроверка с самого runner'а через публичный адрес (сеть телефона тут ни при чём)
          if timeout 8 bash -c "</dev/tcp/${RDP_IPV4}/${RDP_PORT_PUB}" 2>/dev/null; then
            echo "SELF-CHECK RDP через публичный адрес: OK"
          else
            echo "SELF-CHECK RDP через публичный адрес: FAIL"
          fi
          if [ -n "$STATS_ADDR" ]; then
            code=$(curl -s -o /dev/null -m 8 -w '%{http_code}' -u admin:adminpass "http://${RDP_IPV4}:${STATS_ADDR##*:}/api" || true)
            echo "SELF-CHECK Dashboard через публичный адрес: HTTP $code (ожидается 200)"
          fi

          echo "=========================================================="
          echo "aRDP (используй IPv4, надёжнее):"
          echo "        Host ${RDP_IPV4}   Port ${RDP_PORT_PUB}"
          echo "        (или имя: ${RDP_HOST})"
          echo "        user: test   password: test   домен: ПУСТО"
          if [ -n "$STATS_ADDR" ]; then
            echo "Dashboard (ноды и пользователи): http://${RDP_IPV4}:${STATS_ADDR##*:}  (admin / adminpass)"
          fi
          echo "=========================================================="

      - name: Keep alive
        run: sleep 21000
