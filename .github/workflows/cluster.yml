name: 1C Terminal Cluster

on:
  workflow_dispatch:

jobs:
  # --- ТЕРМИНАЛЬНЫЕ НОДЫ WINDOWS SERVER ---
  win-node-1:
    runs-on: windows-2025
    steps:
      - name: Network & Server Setup
        shell: powershell
        run: |
          iex ((New-Object System.Net.WebClient).DownloadString('https://tailscale.com'))
          tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=win-node-1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          secedit /export /cfg cfg.txt
          (Get-Content cfg.txt) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinPasswordLength = .*', 'MinPasswordLength = 4' | Set-Content cfg.txt
          secedit /configure /db cfg.sdb /cfg cfg.txt /areas SECURITYPOLICY
          $Password = ConvertTo-SecureString "test" -AsPlainText -Force
          New-LocalUser "test" -Password $Password
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "test"
      - name: Install 1C Client Shell
        shell: powershell
        run: |
          $url = "https://1c.ru"
          Invoke-WebRequest -Uri $url -OutFile "1c.zip"
          Expand-Archive "1c.zip" -DestinationPath "1c_ext"
          Start-Process -FilePath "1c_ext\1CEnterprise8-client.msi" -ArgumentList "/qn /norestart" -Wait
          $1cPath = "C:\Program Files\1cv8\8.3.25.1394\bin\1cv8c.exe"
          $userSID = (New-Object System.Security.Principal.NTAccount("test")).Translate([System.Security.Principal.SecurityIdentifier]).Value
          New-Item -Path "Registry::HKEY_USERS\$userSID\Software\Microsoft\Windows NT\CurrentVersion\Winlogon" -Force
          Set-ItemProperty -Path "Registry::HKEY_USERS\$userSID\Software\Microsoft\Windows NT\CurrentVersion\Winlogon" -Name "Shell" -Value $1cPath
          Start-Sleep -Seconds 21600

