          Set-ItemProperty -Path "Registry::HKEY_USERS\$userSID\Software\Microsoft\Windows NT\CurrentVersion\Winlogon" -Name "Shell" -Value $1cPath
          Start-Sleep -Seconds 21600

  # --- БАЛАНСИРОВЩИК НАГРУЗКИ HAProxy ---
  load-balancer:
    runs-on: ubuntu-latest
    needs: [win-node-1, win-node-2, win-node-3]
    steps:
      - name: Setup Network & HAProxy
        run: |
          curl -fsSL https://tailscale.com | sh
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=balancer
          sudo apt-get update && sudo apt-get install -y haproxy jq
          
          cat <<EOF | sudo tee /etc/haproxy/haproxy.cfg
          global
                  log /dev/log local0
          defaults
                  log     global
                  mode    tcp
                  timeout connect 5s
                  timeout client  50s
                  timeout server  50s
          listen stats
                  mode http
                  bind *:8404
                  stats enable
                  stats uri /
                  stats refresh 2s
                  stats auth admin:adminpass
          frontend rdp_front
                  bind *:3389
                  default_backend rdp_back
          backend rdp_back
                  mode tcp
                  balance roundrobin
                  server win1 win-node-1:3389 check inter 2s
                  server win2 win-node-2:3389 check inter 2s
                  server win3 win-node-3:3389 check inter 2s
          EOF
          sudo systemctl restart haproxy

      - name: Start ngrok Tunnel
        run: |
          curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install ngrok
          
          cat <<EOF > ngrok.yml
          version: "2"
          authtoken: ${{ secrets.NGROK_AUTH_TOKEN }}
          tunnels:
            rdp:
              proto: tcp
              addr: 3389
            stats:
              proto: http
              addr: 8404
          EOF
          
          ngrok start --all --config ngrok.yml --log=stdout > /dev/null &
          sleep 5
          echo "=========================================================="
          echo "ССЫЛКА ДЛЯ ПОДКЛЮЧЕНИЯ В aRDP:"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | select(.name=="rdp") | .public_url'
          echo "----------------------------------------------------------"
          echo "ССЫЛКА ДЛЯ БРАУЗЕРА (ПАНЕЛЬ HAProxy):"
          curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[] | select(.name=="stats") | .public_url'
          echo "=========================================================="
          sleep 21600
