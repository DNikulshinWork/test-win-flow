name: 1C Terminal Cluster

on:
  workflow_dispatch:

jobs:
  # --- ТЕРМИНАЛЬНЫЕ НОДЫ WINDOWS SERVER ---
  win-node-1:
    runs-on: windows-2025
    steps:
      - name: Setup Node 1
        shell: powershell
        run: |
          choco install tailscale 1c-enterprise-thin-client -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=win-node-1
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          secedit /export /cfg cfg.txt
          (Get-Content cfg.txt) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinPasswordLength = .*', 'MinPasswordLength = 4' | Set-Content cfg.txt
          secedit /configure /db cfg.sdb /cfg cfg.txt /areas SECURITYPOLICY
          $Password = ConvertTo-SecureString "test" -AsPlainText -Force
          New-LocalUser "test" -Password $Password
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "test"
          $1cPath = "C:\Program Files\1cv8\common\1cv8c.exe"
          $userSID = (New-Object System.Security.Principal.NTAccount("test")).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $targetKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\UserApps\$userSID"
          New-Item -Path $targetKey -Force
          Set-ItemProperty -Path $targetKey -Name "Shell" -Value $1cPath
      - name: Keep Node Alive
        shell: powershell
        run: Start-Sleep -Seconds 21600

  win-node-2:
    runs-on: windows-2025
    steps:
      - name: Setup Node 2
        shell: powershell
        run: |
          choco install tailscale 1c-enterprise-thin-client -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=win-node-2
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          secedit /export /cfg cfg.txt
          (Get-Content cfg.txt) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinPasswordLength = .*', 'MinPasswordLength = 4' | Set-Content cfg.txt
          secedit /configure /db cfg.sdb /cfg cfg.txt /areas SECURITYPOLICY
          $Password = ConvertTo-SecureString "test" -AsPlainText -Force
          New-LocalUser "test" -Password $Password
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "test"
          $1cPath = "C:\Program Files\1cv8\common\1cv8c.exe"
          $userSID = (New-Object System.Security.Principal.NTAccount("test")).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $targetKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\UserApps\$userSID"
          New-Item -Path $targetKey -Force
          Set-ItemProperty -Path $targetKey -Name "Shell" -Value $1cPath
      - name: Keep Node Alive
        shell: powershell
        run: Start-Sleep -Seconds 21600

  win-node-3:
    runs-on: windows-2025
    steps:
      - name: Setup Node 3
        shell: powershell
        run: |
          choco install tailscale 1c-enterprise-thin-client -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=win-node-3
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          secedit /export /cfg cfg.txt
          (Get-Content cfg.txt) -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' -replace 'MinPasswordLength = .*', 'MinPasswordLength = 4' | Set-Content cfg.txt
          secedit /configure /db cfg.sdb /cfg cfg.txt /areas SECURITYPOLICY
          $Password = ConvertTo-SecureString "test" -AsPlainText -Force
          New-LocalUser "test" -Password $Password
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "test"
          $1cPath = "C:\Program Files\1cv8\common\1cv8c.exe"
          $userSID = (New-Object System.Security.Principal.NTAccount("test")).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $targetKey = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\UserApps\$userSID"
          New-Item -Path $targetKey -Force
          Set-ItemProperty -Path $targetKey -Name "Shell" -Value $1cPath
      - name: Keep Node Alive
        shell: powershell
        run: Start-Sleep -Seconds 21600

  # --- БАЛАНСИРОВЩИК НА КОРРЕКТНОЙ СЕТЕВОЙ МОДЕЛИ DOCKER ---
  load-balancer:
    runs-on: ubuntu-latest
    steps:
      - name: Run Integrated Cluster Network
        run: |
          # 1. Запускаем базовый сетевой шлюз Tailscale
          docker run -d --name ts-balancer \
            --device=/dev/net/tun:/dev/net/tun \
            --cap-add=NET_ADMIN \
            tailscale/tailscale:latest \
            tailscaled --tun=userspace-networking
          
          sleep 5
          docker exec ts-balancer tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=balancer
          
          # 2. Создаем конфигурацию HAProxy (Используем DNS-имена Tailscale, так как контейнеры находятся внутри VPN)
          mkdir -p /home/runner/haproxy-config
          cat <<EOF > /home/runner/haproxy-config/haproxy.cfg
          global
                  log stdout format raw local0
          defaults
                  log     global
                  mode    tcp
                  timeout connect 5s
                  timeout client  50s
                  timeout server  50s
          listen stats
                  mode http
                  bind 0.0.0.0:8404
                  stats enable
                  stats uri /
                  stats refresh 2s
                  stats auth admin:adminpass
          frontend rdp_front
                  bind 0.0.0.0:3389
                  default_backend rdp_back
          backend rdp_back
                  mode tcp
                  balance roundrobin
                  server win1 win-node-1:3389 check inter 2s
                  server win2 win-node-2:3389 check inter 2s
                  server win3 win-node-3:3389 check inter 2s
          EOF

          # Запускаем балансировщик HAProxy СТРОГО внутри сети контейнера Tailscale
          docker run -d --name haproxy-balancer \
            --net=container:ts-balancer \
            -v /home/runner/haproxy-config:/usr/local/etc/haproxy:ro \
            haproxy:latest

          # 3. Подготовка и запуск туннелей FRP прямо внутри той же сети Tailscale
          RDP_PORT=$((15000 + RANDOM % 20000))
          STATS_PORT=$((36000 + RANDOM % 20000))
          mkdir -p /home/runner/frp-config
          
          cat <<EOF > /home/runner/frp-config/frpc.toml
          serverAddr = "v2.frp.one"
          serverPort = 7000
          
          [[proxies]]
          name = "rdp-cluster-${{ github.run_id }}"
          type = "tcp"
          localIp = "127.0.0.1"
          localPort = 3389
          remotePort = $RDP_PORT
          
          [[proxies]]
          name = "stats-cluster-${{ github.run_id }}"
          type = "tcp"
          localIp = "127.0.0.1"
          localPort = 8404
          remotePort = $STATS_PORT
          EOF
          
          # Запускаем FRP-клиент СТРОГО в сети контейнера Tailscale
          docker run -d --name frp-client \
            --net=container:ts-balancer \
            -v /home/runner/frp-config:/etc/frp \
            fatedier/frpc:v0.54.0 -c /etc/frp/frpc.toml
          
          sleep 5
          
          echo "=========================================================="
          echo "ДАННЫЕ ДЛЯ ПОДКЛЮЧЕНИЯ С ТЕЛЕФОНА (БЕСПЛАТНО):"
          echo "----------------------------------------------------------"
          echo "ДЛЯ ПОДКЛЮЧЕНИЯ В ПРИЛОЖЕНИИ aRDP:"
          echo "Host: v2.frp.one"
          echo "Port: $RDP_PORT"
          echo "Пользователь/Пароль/Домен: test / test / test"
          echo "----------------------------------------------------------"
          echo "ДЛЯ ОТСЛЕЖИВАНИЯ БАЛАНСИРОВКИ В БРАУЗЕРЕ:"
          echo "Адрес: http://frp.one:$STATS_PORT"
          echo "Логин/Пароль: admin / adminpass"
          echo "=========================================================="
          sleep 21600
